name: AQ OS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile aqos_core.py test_aqos.py test_aqos_hardening.py
      - run: python test_aqos.py
      - run: python test_aqos_hardening.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - run: cargo test -p aqos-policy
      - run: cargo build -p aqos-kernel --target x86_64-unknown-none
