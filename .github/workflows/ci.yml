name: AQ OS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile aqos_core.py test_aqos.py test_aqos_hardening.py
      - run: python test_aqos.py
      - run: python test_aqos_hardening.py
      - uses: dtolnay/rust-toolchain@nightly-2026-11-21
        with:
          targets: x86_64-unknown-none
          components: rust-src,llvm-tools-preview
      - run: cargo test -p aqos-policy
      - run: cargo test -p aqos-syscall
      - run: cargo build -p aqos-kernel --target x86_64-unknown-none
      - run: cargo run -p aqos-image
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Boot memory-manager image in QEMU
        shell: bash
        run: |
          set +e
          timeout 12 cargo run -p aqos-image -- --run > qemu.log 2>&1
          code=$?
          set -e
          test "$code" -eq 124
          grep -q "AQ OS kernel: memory manager OK" qemu.log
          grep -q "AQ OS kernel: syscall capability gate OK" qemu.log
          grep -q "AQ OS kernel: interrupts and timer OK" qemu.log
          grep -q "AQ OS scheduler current task:" qemu.log
