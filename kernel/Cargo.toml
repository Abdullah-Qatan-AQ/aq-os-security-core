[package]
name = "aqos-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aqos-syscall = { path = "../aqos-syscall" }
bootloader_api = "0.11.17"
linked_list_allocator = "0.10"
pic8259 = "0.10"
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex", "once"] }
x86_64 = { version = "0.15", default-features = false, features = ["instructions", "abi_x86_interrupt"] }

[[bin]]
name = "aqos-kernel"
path = "src/main.rs"
test = false
bench = false
